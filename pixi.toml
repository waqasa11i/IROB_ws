[workspace]
authors = ["Waqas Ali <waqasali@kth.se>"]
name = "IROB_ws"
channels = [
	"https://prefix.dev/pixi-build-backends",
	"https://prefix.dev/conda-forge",
	"https://prefix.dev/robostack-jazzy",
]
platforms = [
  "linux-64",
]
version = "1.0.0"
preview = ["pixi-build"]

[dependencies]
# ROS
ros-jazzy-desktop = ">=0.11.0,<0.12"
ros-jazzy-ros2run = ">=0.32.6,<0.33"
ros-jazzy-rviz2 = ">=14.1.16,<15"
ros-jazzy-tf2-ros = ">=0.36.15,<0.37"
ros-jazzy-tf2-tools = ">=0.36.15,<0.37"
ros-jazzy-turtlesim = ">=1.8.3,<2"
ros-jazzy-slam-toolbox = ">=2.8.2,<3"
ros-jazzy-action-msgs = ">=2.0.2,<2.1"
ros-jazzy-sensor-msgs = ">=5.3.6,<6"
ros-jazzy-geometry-msgs = ">=5.3.6,<6"
ros-jazzy-nav-msgs = ">=5.3.6,<6"
ros-jazzy-rqt-gui = ">=1.6.2,<2"
ros-jazzy-rqt-common-plugins = ">=1.2.0,<2"
ros-jazzy-turtlebot3  = ">=2.3.1,<3"
ros-jazzy-turtlebot3-gazebo  = ">=2.3.7,<3"
ros-jazzy-robot-state-publisher = ">=3.3.3,<4"
ros-jazzy-ros-gz = ">=1.0.11,<2"
#ros-jazzy-nav2-behavior-tree = ">=,<"
#ros-jazzy-nav2-bringup = 
gazebo = ">=11.15.1,<12"
ros-jazzy-controller-manager = ">=4.42.1,<5"

# Course packages
ros-jazzy-irob-assignment-1 = { path = "src/irob_assignment_1" }
ros-jazzy-controller-manager-msgs = ">=4.42.1,<5"
ros-jazzy-nav2-bringup = ">=1.3.10,<2"
colcon-common-extensions = ">=0.3.0,<0.4"

[tasks]
simulator = { cmd = "ros2 launch irob_assignment_1 simulator.launch.py" }
navigation = { cmd = "ros2 launch irob_assignment_1 start_navigation.launch.py" }
start = { cmd = "ros2 launch irob_assignment_1 start.launch.py" }
